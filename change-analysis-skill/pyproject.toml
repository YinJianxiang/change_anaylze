[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-analysis-skill"
version = "0.2.0"
description = "Standalone TAPD/DingTalk requirement and Git change evidence collector for Codex"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter==0.23.2",
    "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
dingtalk = ["mcp>=1.8,<2"]
database = ["PyMySQL>=1.1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
change_analysis_skill = ["guidance/*.md"]

