services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  llm-server:
    build: .
    command: ["python", "-m", "orchestrator.llm_server"]
    restart: unless-stopped
    env_file: .env
    ports: ["8081:8081"]
  task-worker:
    build: .
    command: ["python", "-m", "orchestrator.task_worker", "--consume", "--database", "/data/tasks.sqlite3", "--config", "/app/.local/projects.json"]
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      LLM_SERVER_URL: http://llm-server:8081/analyze
    volumes: ["task-data:/data", "./.local:/app/.local:ro"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      llm-server: {condition: service_started}
  mail-ingest:
    build: .
    command: ["python", "-m", "orchestrator.mail_ingest", "--database", "/data/tasks.sqlite3"]
    env_file: .env
    environment: {RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"}
    volumes: ["task-data:/data"]
    depends_on:
      rabbitmq: {condition: service_healthy}
    profiles: ["ingest"]
  feishu:
    build: .
    command: ["python", "-m", "orchestrator.feishu_long_connection", "--database", "/data/feishu.sqlite3"]
    restart: unless-stopped
    env_file: .env
    environment: {RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"}
    volumes: ["task-data:/data"]
    depends_on:
      rabbitmq: {condition: service_healthy}
volumes:
  rabbitmq-data:
  task-data:
