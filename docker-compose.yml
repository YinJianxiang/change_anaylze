services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  change-analysis-mcp:
    build: .
    command: ["python", "-m", "orchestrator.mcp_server", "--config", "/app/.local/projects.json", "--database", "/data/tasks.sqlite3"]
    restart: unless-stopped
    env_file: .env
    ports: ["8082:8082"]
    volumes: ["task-data:/data", "./.local:/app/.local:ro"]
  task-worker:
    build: .
    command: ["python", "-m", "orchestrator.task_worker", "--consume", "--database", "/data/tasks.sqlite3"]
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    volumes: ["task-data:/data", "./.local:/app/.local:ro"]
    depends_on:
      rabbitmq: {condition: service_healthy}
  mail-ingest:
    build: .
    command: ["python", "-m", "orchestrator.mail_ingest", "--database", "/data/tasks.sqlite3"]
    env_file: .env
    environment: {RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"}
    volumes: ["task-data:/data", "./.local:/app/.local:ro"]
    depends_on:
      rabbitmq: {condition: service_healthy}
    profiles: ["ingest"]
volumes:
  rabbitmq-data:
  task-data:
